# What Snug posts are about. The bot rotates through these (least recently used first) so posts
# don't repeat. Add more freely: a style or problem is picked up on the next run.

# ---- Format A: "let's make this <style> ✍️" (an empty room -> 6 versions of one style) ----------
# name: as it reads in the hook. tag: the style's hashtag. notes: what the style is made of (the
# writer builds the 6 sub-styles from it). rooms: which rooms it suits.
[[styles]]
id = "midcentury"
name = "mid-century"
tag = "#midcenturymodern"
notes = "walnut and teak, tapered legs, mushroom and arc lamps, bold graphic art, mustard, olive, burnt orange"
rooms = ["living room", "bedroom", "kitchen"]


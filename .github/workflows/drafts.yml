name: Snug drafts

on:
  schedule:
    # Once an hour: makes posts ahead (pictures ordered from Google's half-price batch service), picks up
    # finished ones and sends whatever is due (config.toml post_times). GitHub often runs this late or
    # skips runs; the next run catches up.
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snug
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    outputs:
      send: ${{ steps.tick.outputs.send }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Finished slides wait in GitHub's cache (not in the repo), so the repo doesn't fill up with images.
      - uses: actions/cache/restore@v4
        with:
          path: queue
          key: snug-queue-${{ github.run_id }}
          restore-keys: snug-queue-

      - name: Make posts ahead and list what's due
        id: tick
        run: python -m snugbot tick
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - if: steps.tick.outputs.queue_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: queue
          key: snug-queue-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the plan, the room library and the dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state site
          git diff --cached --quiet && exit 0
          git commit -m "Snug plan $(date -u +%F)"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 20))
          done
          exit 1

      - if: steps.tick.outputs.send == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: due
          path: built.json
          retention-days: 3

      - if: steps.tick.outputs.send == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  send:
    needs: tick
    if: needs.tick.outputs.send == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main          # includes the plan the tick job just saved
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: due
          path: .

      - name: Publish the slides on GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Send to TikTok drafts
        run: python -m snugbot send
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}

      - name: Save the history and login
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet && exit 0
          git commit -m "Snug drafts $(date -u +%F)"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 20))
          done
          exit 1

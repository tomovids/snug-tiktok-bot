name: Snug stats

# Reads @TrySnug's TikTok numbers, updates the auto-tuning and rebuilds the dashboard, twice a day.
on:
  schedule:
    - cron: "25 6 * * *"
    - cron: "25 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: snug
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Read the TikTok numbers
        run: python -m snugbot stats
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}

      - name: Save the stats, tuning and dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state site
          git diff --cached --quiet && exit 0
          git commit -m "Snug stats $(date -u +%F)"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 20))
          done
          exit 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
